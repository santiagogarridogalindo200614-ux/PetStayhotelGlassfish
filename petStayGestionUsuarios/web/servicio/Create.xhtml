<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core">

    <ui:composition template="/template.xhtml">
        <ui:define name="title">
            <h:outputText value="#{bundle.CreateServicioTitle}"></h:outputText>
        </ui:define>
        <ui:define name="body">
            <h:panelGroup id="messagePanel" layout="block">
                <h:messages errorStyle="color: red" infoStyle="color: green" layout="table"/>
            </h:panelGroup>
            <h:form>
<h:panelGrid columns="2">
    <!-- NOMBRE: obligatorio -->
    <h:outputLabel value="#{bundle.CreateServicioLabel_nombre}" for="nombre" />
    <h:inputText id="nombre" value="#{servicioController.selected.nombre}" title="#{bundle.CreateServicioTitle_nombre}"
                 required="true" requiredMessage="#{bundle.CreateServicioRequiredMessage_nombre}" />

    <!-- DESCRIPCION: opcional -->
    <h:outputLabel value="#{bundle.CreateServicioLabel_descripcion}" for="descripcion" />
    <h:inputText id="descripcion" value="#{servicioController.selected.descripcion}" title="#{bundle.CreateServicioTitle_descripcion}" />

    <!-- PRECIO: obligatorio y numerico -->
    <h:outputLabel value="#{bundle.CreateServicioLabel_precio}" for="precio" />
    <h:inputText id="precio" value="#{servicioController.selected.precio}" title="#{bundle.CreateServicioTitle_precio}"
                 required="true" requiredMessage="#{bundle.CreateServicioRequiredMessage_precio}"
                 converterMessage="#{bundle.CreateServicioConverterMessage_precio}" />

    <!-- ESTADO -->
    <h:outputLabel value="#{bundle.CreateServicioLabel_estado}" for="estado" />
    <h:selectOneMenu id="estado" value="#{servicioController.selected.estado}">
        <f:selectItem itemValue="Activo" itemLabel="Activo"/>
        <f:selectItem itemValue="Inactivo" itemLabel="Inactivo"/>
    </h:selectOneMenu>
</h:panelGrid>
                <br />
                <h:commandLink action="#{servicioController.create}" value="#{bundle.CreateServicioSaveLink}" />
                <br />
                <br />
                <h:commandLink action="#{servicioController.prepareList}" value="#{bundle.CreateServicioShowAllLink}" immediate="true"/>
                <br />
                <br />
                <h:link outcome="/index" value="#{bundle.CreateServicioIndexLink}"/>
            </h:form>
        </ui:define>
    </ui:composition>

</html>
