<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core">

    <ui:composition template="/template.xhtml">
        <ui:define name="title">
            <h:outputText value="#{bundle.EditHabitacionTitle}"></h:outputText>
        </ui:define>
        <ui:define name="body">
            <h:panelGroup id="messagePanel" layout="block">
                <h:messages errorStyle="color: red" infoStyle="color: green" layout="table"/>
            </h:panelGroup>
            <h:form>
                <h:panelGrid columns="2">
                    <h:outputLabel value="#{bundle.EditHabitacionLabel_numero}" for="numero" />
                    <h:inputText id="numero" value="#{habitacionController.selected.numero}" title="#{bundle.EditHabitacionTitle_numero}" />
                    <h:outputLabel value="#{bundle.EditHabitacionLabel_tipo}" for="tipo" />
                    <h:inputText id="tipo" value="#{habitacionController.selected.tipo}" title="#{bundle.EditHabitacionTitle_tipo}" />
                    <h:outputLabel value="#{bundle.EditHabitacionLabel_capacidad}" for="capacidad" />
                    <h:inputText id="capacidad" value="#{habitacionController.selected.capacidad}" title="#{bundle.EditHabitacionTitle_capacidad}" />
                    <h:outputLabel value="#{bundle.EditHabitacionLabel_precioNoche}" for="precioNoche" />
                    <h:inputText id="precioNoche" value="#{habitacionController.selected.precioNoche}" title="#{bundle.EditHabitacionTitle_precioNoche}" />
                    <h:outputLabel value="#{bundle.EditHabitacionLabel_estado}" for="estado" />
                    <h:inputText id="estado" value="#{habitacionController.selected.estado}" title="#{bundle.EditHabitacionTitle_estado}" />
                </h:panelGrid>
                <h:commandLink action="#{habitacionController.update}" value="#{bundle.EditHabitacionSaveLink}"/>
                <br />
                <br />
                <h:link outcome="View" value="#{bundle.EditHabitacionViewLink}"/>
                <br />
                <h:commandLink action="#{habitacionController.prepareList}" value="#{bundle.EditHabitacionShowAllLink}" immediate="true"/>
                <br />
                <br />
                <h:link outcome="/index" value="#{bundle.EditHabitacionIndexLink}" />
            </h:form>
        </ui:define>
    </ui:composition>

</html>
