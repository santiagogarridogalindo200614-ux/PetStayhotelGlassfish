<?xml version='1.0' encoding='UTF-8' ?>

      xmlns:ui="http://xmlns.jcp.org/jsf/facelets">

    <!-- Esta pagina usa la plantilla template.xhtml -->

        <!-- Se inserta donde la plantilla tiene ui:insert name="title" -->
        <ui:define name="title">
            <h:outputText value="Inicio"/>
        </ui:define>
        <!-- Se inserta donde la plantilla tiene ui:insert name="body" -->
        <ui:define name="body">
            <!-- &#243; es la letra o con tilde -->
            <h:outputText value="Bienvenido al sistema de gesti&#243;n de PetStay Hotel."/>
        </ui:define>
    </ui:composition>
</html>
