<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core">

    <ui:composition template="/template.xhtml">
        <ui:define name="title">
            <h:outputText value="#{bundle.EditPagoTitle}"></h:outputText>
        </ui:define>
        <ui:define name="body">
            <h:panelGroup id="messagePanel" layout="block">
                <h:messages errorStyle="color: red" infoStyle="color: green" layout="table"/>
            </h:panelGroup>
            <h:form>
                <h:panelGrid columns="2">
                    <h:outputLabel value="#{bundle.EditPagoLabel_idPago}" for="idPago" />
                    <h:inputText id="idPago" value="#{pagoController.selected.idPago}" title="#{bundle.EditPagoTitle_idPago}" required="true" requiredMessage="#{bundle.EditPagoRequiredMessage_idPago}"/>
                    <h:outputLabel value="#{bundle.EditPagoLabel_fechaPago}" for="fechaPago" />
                    <h:inputText id="fechaPago" value="#{pagoController.selected.fechaPago}" title="#{bundle.EditPagoTitle_fechaPago}" >
                        <f:convertDateTime pattern="MM/dd/yyyy" />
                    </h:inputText>
                    <h:outputLabel value="#{bundle.EditPagoLabel_valor}" for="valor" />
                    <h:inputText id="valor" value="#{pagoController.selected.valor}" title="#{bundle.EditPagoTitle_valor}" />
                    <h:outputLabel value="#{bundle.EditPagoLabel_modeloPago}" for="modeloPago" />
                    <h:inputText id="modeloPago" value="#{pagoController.selected.modeloPago}" title="#{bundle.EditPagoTitle_modeloPago}" />
                    <h:outputLabel value="#{bundle.EditPagoLabel_estado}" for="estado" />
                    <h:inputText id="estado" value="#{pagoController.selected.estado}" title="#{bundle.EditPagoTitle_estado}" />
                    <h:outputLabel value="#{bundle.EditPagoLabel_idReserva}" for="idReserva" />
                    <h:selectOneMenu id="idReserva" value="#{pagoController.selected.idReserva}" title="#{bundle.EditPagoTitle_idReserva}" required="true" requiredMessage="#{bundle.EditPagoRequiredMessage_idReserva}">
                        <f:selectItems value="#{reservaController.itemsAvailableSelectOne}"/>
                    </h:selectOneMenu>
                </h:panelGrid>
                <h:commandLink action="#{pagoController.update}" value="#{bundle.EditPagoSaveLink}"/>
                <br />
                <br />
                <h:link outcome="View" value="#{bundle.EditPagoViewLink}"/>
                <br />
                <h:commandLink action="#{pagoController.prepareList}" value="#{bundle.EditPagoShowAllLink}" immediate="true"/>
                <br />
                <br />
                <h:link outcome="/index" value="#{bundle.EditPagoIndexLink}" />
            </h:form>
        </ui:define>
    </ui:composition>

</html>
